spring.application.name=service-expeditions
spring.config.import=optional:configserver:http://localhost:8888
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:h2:mem:expeditionsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
management.endpoints.web.exposure.include=health,info
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.bulkhead.bulkhead-aspect-order=3
resilience4j.retry.instances.service-clients.max-attempts=3
resilience4j.retry.instances.service-clients.wait-duration=500ms
resilience4j.retry.instances.service-clients.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.retry.instances.service-reseau.max-attempts=3
resilience4j.retry.instances.service-reseau.wait-duration=500ms
resilience4j.retry.instances.service-reseau.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.circuitbreaker.instances.service-clients.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-clients.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-clients.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-clients.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-clients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-clients.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-clients.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-clients.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.service-reseau.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-reseau.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-reseau.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-reseau.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-reseau.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-reseau.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.service-reseau.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-reseau.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.bulkhead.instances.service-clients.max-concurrent-calls=10
resilience4j.bulkhead.instances.service-clients.max-wait-duration=0ms
resilience4j.bulkhead.instances.service-reseau.max-concurrent-calls=10
resilience4j.bulkhead.instances.service-reseau.max-wait-duration=0ms
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
app.kafka.topic.shipment-requested=shipment.requested
app.kafka.topic.shipment-capacity-reserved=shipment.capacity.reserved
app.kafka.topic.shipment-capacity-rejected=shipment.capacity.rejected
app.kafka.topic.shipment-in-transit=shipment.in-transit
app.kafka.topic.shipment-delivered=shipment.delivered
app.kafka.topic.parcel-returned=parcel.returned
app.kafka.topic.parcel-lost=parcel.lost
app.kafka.topic.notification=notification.email.requested

spring.kafka.consumer.group-id=service-expeditions-group
spring.kafka.producer.properties.spring.json.add.type.headers=false
