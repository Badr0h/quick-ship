spring.application.name=service-notification
spring.config.import=optional:configserver:http://localhost:8888
server.port=8084
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
app.kafka.topic.shipment-requested=shipment.requested
app.kafka.topic.shipment-capacity-reserved=shipment.capacity.reserved
app.kafka.topic.shipment-capacity-rejected=shipment.capacity.rejected
app.kafka.topic.shipment-in-transit=shipment.in-transit
app.kafka.topic.shipment-delivered=shipment.delivered
app.kafka.topic.parcel-returned=parcel.returned
app.kafka.topic.parcel-lost=parcel.lost
app.kafka.topic.notification=notification.email.requested

spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.properties.spring.json.value.default.type=com.quickship.servicenotification.messaging.event.NotificationEmailRequestedEvent
spring.kafka.producer.properties.spring.json.add.type.headers=false
