networks:
  tp-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: quickship-rabbitmq
    networks:
      - tp-net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: tp
      RABBITMQ_DEFAULT_PASS: tp123

  mailpit:
    image: axllent/mailpit
    container_name: quickship-mailpit
    networks:
      - tp-net
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
